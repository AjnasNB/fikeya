[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fikeya-interop"
version = "0.1.0a1"
description = "Bounded ACP, Codex app-server, and MCP interoperability for Fikeya."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
  { name = "Fikeya contributors" },
]
dependencies = [
  "agent-client-protocol==0.12.1",
  "mcp==2.0.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fikeya_interop = ["py.typed"]

[tool.setuptools.data-files]
"share/fikeya-interop/manifests" = [
  "manifests/codex-app-server.json",
  "manifests/generic-acp.example.json",
  "manifests/generic-mcp.example.json",
  "manifests/interop-manifest.schema.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
