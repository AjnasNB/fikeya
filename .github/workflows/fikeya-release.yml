name: Fikeya beta release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package-windows:
    name: Build, verify, and package Windows beta
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/fikeya-desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Code OSS dependencies
        run: npm ci
      - name: Build release artifacts
        shell: pwsh
        env:
          FIKEYA_SIGNING_PFX_BASE64: ${{ secrets.FIKEYA_SIGNING_PFX_BASE64 }}
          FIKEYA_SIGNING_PFX_PASSWORD: ${{ secrets.FIKEYA_SIGNING_PFX_PASSWORD }}
        run: ./scripts/fikeya/package-release.ps1
      - name: Verify an Authenticode signature when signing credentials are configured
        shell: pwsh
        run: |
          $installer = Get-ChildItem release-artifacts/FikeyaSetup-*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($env:FIKEYA_SIGNING_PFX_BASE64 -and $signature.Status -ne 'Valid') {
            throw "Signing credentials were configured but the installer signature is $($signature.Status)."
          }
          Write-Host "Installer signature status: $($signature.Status)"
        env:
          FIKEYA_SIGNING_PFX_BASE64: ${{ secrets.FIKEYA_SIGNING_PFX_BASE64 }}
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fikeya-0.1.0-beta.1-release
          path: release-artifacts/*
          if-no-files-found: error
      - name: Publish GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release-artifacts/*
