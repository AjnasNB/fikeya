name: Code OSS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'release/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  VSCODE_QUALITY: 'oss'

jobs:
  compile:
    name: Compile & Hygiene
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout microsoft/vscode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-compile
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check /build/ scripts
        run: npm run typecheck
        working-directory: build

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Markdown editor manifests
        run: |
          npm run markdown-editor-package-json-check
          npm --prefix extensions/markdown-language-features run test-markdown-editor-package-json

      - name: Compile & Hygiene
        # The standard hosted runner cannot safely overlap the minified Code OSS
        # build with the full-repository ESLint process. Run every gate serially
        # so a valid build is not reported as failed by an out-of-memory shutdown.
        run: npm exec -- npm-run-all2 -lp --max-parallel 1 core-ci hygiene eslint valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Codex protocol client is in sync
        run: |
          if [ -z "$CODEX_SYNC_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$CODEX_DEFAULT_BRANCH:refs/remotes/origin/$CODEX_DEFAULT_BRANCH"
            CODEX_SYNC_BASE="origin/$CODEX_DEFAULT_BRANCH"
          else
            git fetch --no-tags --depth=1 origin "$CODEX_SYNC_BASE"
          fi
          node build/codex/check-protocol-sync.ts --if-changed --base "$CODEX_SYNC_BASE"
        env:
          CODEX_SYNC_BASE: ${{ github.event.pull_request.base.sha }}
          CODEX_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Check cyclic dependencies
        run: node build/lib/checkCyclicDependencies.ts out-build

  linux-cli-tests:
    name: Linux
    # This inherited workflow targets Microsoft's private 1ES runner pool.
    # Keep it available for upstream synchronization without leaving forks in
    # an impossible queue. Fikeya's hosted CLI/runtime gates run separately.
    if: github.repository_owner == 'microsoft'
    uses: ./.github/workflows/pr-linux-cli-test.yml
    with:
      job_name: CLI
      rustup_toolchain: 1.88

  linux-electron-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron
      electron_tests: true
      smoke_tests: false

  linux-browser-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Browser
      browser_tests: true

  linux-remote-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Remote
      remote_tests: true
      smoke_tests: false

  macos-electron-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Electron
      electron_tests: true
      smoke_tests: false

  macos-browser-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Browser
      browser_tests: true

  macos-remote-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Remote
      remote_tests: true
      smoke_tests: false

  windows-electron-tests:
    name: Windows
    # The reusable Windows suites target Microsoft's private 1ES runners.
    # Fikeya verifies Windows through its hosted bootstrap, runtime, VSIX, and
    # packaging gates instead of scheduling jobs no public runner can claim.
    if: github.repository_owner == 'microsoft'
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron
      electron_tests: true
      smoke_tests: false

  windows-browser-tests:
    name: Windows
    if: github.repository_owner == 'microsoft'
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Browser
      browser_tests: true

  windows-remote-tests:
    name: Windows
    if: github.repository_owner == 'microsoft'
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Remote
      remote_tests: true
      smoke_tests: false
