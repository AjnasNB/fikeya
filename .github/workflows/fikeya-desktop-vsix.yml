name: Fikeya Desktop VSIX

on:
  pull_request:
    paths:
      - 'extensions/fikeya-desktop/**'
      - 'fikeya-runtime/LICENSE'
      - '.github/workflows/fikeya-desktop-vsix.yml'
  push:
    branches:
      - main
    paths:
      - 'extensions/fikeya-desktop/**'
      - 'fikeya-runtime/LICENSE'
      - '.github/workflows/fikeya-desktop-vsix.yml'

permissions:
  contents: read

jobs:
  package:
    name: Test isolated Windows x64 VSIX
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extensions/fikeya-desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/fikeya-desktop/package-lock.json

      - name: Use Python 3.10.0
        uses: actions/setup-python@v7
        with:
          python-version: '3.10.0'

      - name: Install pinned runtime builder
        run: python -m pip install --requirement runtime-build-requirements.txt

      - name: Install pinned dependencies
        run: npm ci

      - name: Build and inspect VSIX
        run: npm run package:vsix

      - name: Resolve the versioned VSIX artifact
        id: artifact
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $artifact = (Resolve-Path -LiteralPath "artifacts/fikeya-desktop-$version-win32-x64.vsix").Path
          "path=$artifact" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned VSIX
        uses: actions/upload-artifact@v4
        with:
          name: fikeya-desktop-win32-x64-unsigned-vsix
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7
